<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Class Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Rajdhani:wght@400;600;700&family=Orbitron:wght@500;700;900&family=Exo+2:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg:         #0a0a0a;
            --surface:    #111111;
            --surface-2:  #181818;
            --border:     rgba(255,255,255,0.07);
            --text:       #e2e8f0;
            --text-dim:   #94a3b8;
            --text-muted: #475569;
            --portfolio:  #6366f1;
            --portfolio-h:#4f46e5;
        }

        body {
            font-family: 'Exo 2', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ── Track selector ─────────────────────────────────── */

        #selector {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .selector-inner { max-width: 680px; width: 100%; text-align: center; }

        .selector-eyebrow {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .selector-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 40px;
        }

        .track-btns {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .track-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 28px 16px;
            cursor: pointer;
            transition: all 0.18s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            text-align: center;
        }

        .track-btn:hover {
            background: var(--surface-2);
            transform: translateY(-3px);
            border-color: rgba(255,255,255,0.15);
        }

        .track-btn-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            font-weight: 900;
        }

        .track-btn-name {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-dim);
            line-height: 1.4;
        }

        /* ── Hub ────────────────────────────────────────────── */

        #hub { display: none; flex-direction: column; min-height: 100vh; }

        /* Top bar */
        .top-bar {
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 28px;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 50;
            flex-shrink: 0;
        }

        .school-badge {
            background: rgba(255,255,255,0.18);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 20px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 4px 12px;
            color: #fff;
            flex-shrink: 0;
        }

        .course-name {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
            text-transform: uppercase;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .top-bar-right { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }

        .portfolio-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: var(--portfolio);
            color: #fff;
            text-decoration: none;
            font-family: 'Exo 2', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            padding: 9px 22px;
            border-radius: 8px;
            transition: background 0.15s, box-shadow 0.15s;
            white-space: nowrap;
        }

        .portfolio-btn:hover {
            background: var(--portfolio-h);
            box-shadow: 0 4px 20px rgba(99,102,241,0.4);
        }

        .switch-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-family: 'Exo 2', sans-serif;
            font-size: 0.75rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: color 0.15s;
        }
        .switch-btn:hover { color: var(--text-dim); }

        /* Main content */
        .hub-main { flex: 1; padding: 32px 28px 48px; max-width: 1300px; width: 100%; margin: 0 auto; }

        .section { margin-bottom: 36px; }

        .section-label {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        /* Unit / project grid */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .unit-card {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 4px solid var(--card-accent, #555);
            border-radius: 0 8px 8px 0;
            padding: 14px 16px 12px;
            text-decoration: none;
            color: var(--text);
            transition: background 0.15s, transform 0.15s, border-color 0.15s;
            position: relative;
            min-height: 80px;
        }

        .unit-card:hover {
            background: var(--surface-2);
            transform: translateY(-2px);
            border-color: rgba(255,255,255,0.12);
            border-left-color: var(--card-accent, #555);
        }

        .unit-card:hover .card-arrow { opacity: 1; }

        .card-num {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.62rem;
            font-weight: 700;
            color: var(--card-accent, #94a3b8);
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .card-name {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.98rem;
            font-weight: 600;
            line-height: 1.3;
            color: var(--text);
            flex: 1;
        }

        .card-arrow {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 8px;
            opacity: 0;
            transition: opacity 0.15s;
            align-self: flex-end;
        }

        .card-badge {
            position: absolute;
            top: 8px;
            right: 10px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: var(--card-accent, #555);
            color: #000;
            padding: 2px 7px;
            border-radius: 4px;
        }

        .card-coming {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* DBL project grid — 3 columns */
        .project-grid { grid-template-columns: repeat(3, 1fr); }

        .project-card { min-height: 90px; }

        .card-icon {
            font-size: 1.1rem;
            margin-bottom: 4px;
        }

        /* Reference unit chips */
        .ref-row { display: flex; flex-wrap: wrap; gap: 10px; }

        .ref-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 18px;
            text-decoration: none;
            color: var(--text-dim);
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.15s;
        }

        .ref-chip:hover { background: var(--surface-2); color: var(--text); border-color: rgba(255,255,255,0.15); }

        .ref-chip-num {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            font-weight: 700;
        }

        /* Tools */
        .tools-row { display: flex; flex-wrap: wrap; gap: 10px; }

        .tool-btn {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 11px 20px;
            text-decoration: none;
            color: var(--text-dim);
            font-family: 'Exo 2', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.15s;
        }

        .tool-btn:hover { background: var(--surface-2); color: var(--text); border-color: rgba(255,255,255,0.15); }

        .tool-icon { font-size: 1rem; }

        /* ── Responsive ─────────────────────────────────────── */

        @media (max-width: 960px) {
            .card-grid { grid-template-columns: repeat(3, 1fr); }
            .project-grid { grid-template-columns: repeat(3, 1fr); }
        }

        @media (max-width: 680px) {
            .track-btns { grid-template-columns: 1fr; }
            .card-grid { grid-template-columns: repeat(2, 1fr); }
            .project-grid { grid-template-columns: repeat(2, 1fr); }
            .top-bar { padding: 0 16px; }
            .hub-main { padding: 20px 16px 40px; }
            .course-name { font-size: 1rem; }
        }

        @media (max-width: 420px) {
            .card-grid { grid-template-columns: 1fr; }
            .project-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<!-- ── Track selector ──────────────────────────────────────── -->
<div id="selector">
    <div class="selector-inner">
        <div class="selector-eyebrow">Vicksburg CTE · Mr. Bombich</div>
        <h1 class="selector-title">Which class are you in?</h1>
        <div class="track-btns">
            <button class="track-btn" onclick="selectTrack('hsaer')">
                <span class="track-btn-label" style="color:#c41e3a">HS</span>
                <span class="track-btn-name">Applied Engineering<br>&amp; Robotics</span>
            </button>
            <button class="track-btn" onclick="selectTrack('8aer')">
                <span class="track-btn-label" style="color:#c41e3a">8th</span>
                <span class="track-btn-name">Applied Engineering<br>&amp; Robotics</span>
            </button>
            <button class="track-btn" onclick="selectTrack('dbl')">
                <span class="track-btn-label" style="color:#0891b2">DBL</span>
                <span class="track-btn-name">Design &amp;<br>Build Lab</span>
            </button>
        </div>
    </div>
</div>

<!-- ── Hub ─────────────────────────────────────────────────── -->
<div id="hub">
    <header class="top-bar" id="top-bar">
        <span class="school-badge" id="school-badge">VHS</span>
        <span class="course-name" id="course-name">AE&R</span>
        <div class="top-bar-right">
            <a href="#" class="portfolio-btn" id="portfolio-btn">📋 My Portfolio</a>
            <button class="switch-btn" onclick="resetTrack()" title="Switch class">switch class</button>
        </div>
    </header>

    <div class="hub-main">

        <!-- AER units -->
        <div id="aer-hub">
            <div class="section">
                <div class="section-label">Course Units</div>
                <div class="card-grid" id="unit-grid"></div>
            </div>
            <div class="section">
                <div class="section-label">Tools</div>
                <div class="tools-row">
                    <a href="ai-tutor.html" class="tool-btn"><span class="tool-icon">🤖</span> AI Tutor</a>
                    <a href="CountdownClock/vhs_countdown.html" class="tool-btn"><span class="tool-icon">⏱</span> Countdown Clock</a>
                    <a href="resources/pico2w-reference.html" target="_blank" class="tool-btn"><span class="tool-icon">📡</span> Pico 2W Reference</a>
                </div>
            </div>
        </div>

        <!-- DBL projects -->
        <div id="dbl-hub" style="display:none">
            <div class="section">
                <div class="section-label">Projects</div>
                <div class="card-grid project-grid" id="project-grid"></div>
            </div>
            <div class="section">
                <div class="section-label">Reference Units</div>
                <div class="ref-row" id="ref-unit-row"></div>
            </div>
            <div class="section">
                <div class="section-label">Tools</div>
                <div class="tools-row">
                    <a href="ai-tutor.html" class="tool-btn"><span class="tool-icon">🤖</span> AI Tutor</a>
                </div>
            </div>
        </div>

    </div><!-- /hub-main -->
</div><!-- /hub -->

<script>
(function () {

    /* ── Data ────────────────────────────────────────────── */

    var TRACKS = {
        hsaer: {
            label:   'Applied Engineering & Robotics',
            badge:   'VHS Bulldogs',
            home:    'HSAER/index.html',
            portfolio: 'hsaer',
            type:    'aer',
            r: 196, g: 30, b: 58,   // crimson
            accent:  '#c41e3a'
        },
        '8aer': {
            label:   '8th Grade AE&R',
            badge:   'VMS Bulldogs',
            home:    '8AER/index.html',
            portfolio: 'aer8th',
            type:    'aer',
            r: 196, g: 30, b: 58,
            accent:  '#c41e3a'
        },
        dbl: {
            label:   'Design & Build Lab',
            badge:   'VHS Bulldogs',
            home:    'DBL/index.html',
            portfolio: 'dbl',
            type:    'dbl',
            r: 8, g: 145, b: 178,   // teal
            accent:  '#0891b2'
        }
    };

    var UNITS = [
        { n: 1, label: 'Unit 1', name: 'Engineering Design Process', path: 'Unit_01_Engineering_Design_Process/index.html', accent: '#c41e3a', r: 196, g: 30,  b: 58  },
        { n: 2, label: 'Unit 2', name: 'CAD: Component Design',       path: 'Unit_02_CAD/index.html',                        accent: '#00d084', r: 0,   g: 208, b: 132 },
        { n: 3, label: 'Unit 3', name: 'Shop Safety',                  path: 'Unit_03_Shop_Safety_and_Standard_Practices/index.html', accent: '#f59e0b', r: 245, g: 158, b: 11  },
        { n: 4, label: 'Unit 4', name: 'Programming, Electronics & Sensors', path: 'Unit_04_Programming_Electronics_and_Sensors/index.html', accent: '#00d4ff', r: 0, g: 212, b: 255 },
        { n: 5, label: 'Unit 5', name: 'AI & Machine Learning',        path: 'Unit_05_Artificial_Intelligence/index.html',    accent: '#a855f7', r: 168, g: 85,  b: 247 },
        { n: 6, label: 'Unit 6', name: 'Career Readiness',             path: 'Unit_06_Career_Ready_Practices/index.html',     accent: '#6366f1', r: 99,  g: 102, b: 241 },
        { n: 7, label: 'Unit 7', name: 'Electrical Systems',           path: 'Unit_07_Electrical_Systems/index.html',         accent: '#f59e0b', r: 245, g: 158, b: 11  },
        { n: 8, label: 'Unit 8', name: 'Mechanisms',                   path: 'Unit_08_Mechanisms/index.html',                 accent: '#4ade80', r: 74,  g: 222, b: 128 }
    ];

    var DBL_PROJECTS = [
        { n: 'P1', name: 'Fidget Spinner',      icon: '🌀', path: 'DBL/projects/p1-fidget-spinner.html' },
        { n: 'P2', name: 'Christmas Ornament',  icon: '🎄', path: 'DBL/projects/p2-christmas.html'      },
        { n: 'P3', name: 'LED Sign / Wall Art', icon: '💡', path: 'DBL/projects/p3-led-sign.html'       },
        { n: 'P4', name: 'Silicone Mold Making',icon: '🧪', path: 'DBL/projects/p4-molds.html'          },
        { n: 'P5', name: 'Useless Box',         icon: '📦', path: 'DBL/projects/p5-useless-box.html'    },
        { n: 'P6', name: 'Capstone',            icon: '🏆', path: '#', coming: true                      }
    ];

    var DBL_REF_UNITS = [
        { n: 1, label: 'Unit 1', name: 'EDP',         path: 'Unit_01_Engineering_Design_Process/index.html', accent: '#c41e3a' },
        { n: 2, label: 'Unit 2', name: 'CAD',         path: 'Unit_02_CAD/index.html',                        accent: '#00d084' },
        { n: 3, label: 'Unit 3', name: 'Shop Safety', path: 'Unit_03_Shop_Safety_and_Standard_Practices/index.html', accent: '#f59e0b' },
        { n: 7, label: 'Unit 7', name: 'Electrical Systems', path: 'Unit_07_Electrical_Systems/index.html',  accent: '#f59e0b' },
        { n: 8, label: 'Unit 8', name: 'Mechanisms',  path: 'Unit_08_Mechanisms/index.html',                 accent: '#4ade80' }
    ];

    /* ── Helpers ─────────────────────────────────────────── */

    function param(key) {
        return new URLSearchParams(location.search).get(key);
    }

    function makeCard(href, accentHex, r, g, b, numText, nameText, isCurrent, icon, isProject, isComingSoon) {
        var a = document.createElement(isComingSoon ? 'div' : 'a');
        if (!isComingSoon) a.href = href;
        a.className = 'unit-card' + (isProject ? ' project-card' : '') + (isComingSoon ? ' card-coming' : '');
        a.style.setProperty('--card-accent', accentHex);
        a.style.setProperty('--card-bg', 'rgba(' + r + ',' + g + ',' + b + ',0.06)');
        a.style.background = 'rgba(' + r + ',' + g + ',' + b + ',0.06)';

        var num = document.createElement('div');
        num.className = 'card-num';
        if (icon) num.textContent = icon + '  ' + numText;
        else num.textContent = numText;

        var name = document.createElement('div');
        name.className = 'card-name';
        name.textContent = nameText;

        var arrow = document.createElement('div');
        arrow.className = 'card-arrow';
        arrow.textContent = isComingSoon ? 'Coming soon' : 'Open →';

        a.appendChild(num);
        a.appendChild(name);
        a.appendChild(arrow);

        if (isCurrent) {
            var badge = document.createElement('div');
            badge.className = 'card-badge';
            badge.textContent = 'NOW';
            a.appendChild(badge);
        }

        return a;
    }

    /* ── Render ──────────────────────────────────────────── */

    function render(trackKey) {
        var cfg = TRACKS[trackKey];
        var current = parseInt(param('current'), 10) || 0;

        // Top bar
        var tb = document.getElementById('top-bar');
        tb.style.background = 'linear-gradient(135deg, rgba(' + cfg.r + ',' + cfg.g + ',' + cfg.b + ',0.25) 0%, rgba(' + cfg.r + ',' + cfg.g + ',' + cfg.b + ',0.12) 100%)';
        tb.style.borderBottom = '1px solid rgba(' + cfg.r + ',' + cfg.g + ',' + cfg.b + ',0.3)';
        document.getElementById('school-badge').textContent = cfg.badge;
        document.getElementById('course-name').textContent = cfg.label;

        // Portfolio
        var pb = document.getElementById('portfolio-btn');
        pb.href = 'Portfolio/index.html?track=' + cfg.portfolio;

        // Show correct section
        document.getElementById('selector').style.display = 'none';
        document.getElementById('hub').style.display = 'flex';
        document.getElementById('hub').style.flexDirection = 'column';

        if (cfg.type === 'aer') {
            document.getElementById('aer-hub').style.display = 'block';
            document.getElementById('dbl-hub').style.display = 'none';

            var grid = document.getElementById('unit-grid');
            grid.innerHTML = '';
            UNITS.forEach(function (u) {
                var isCurrent = (u.n === current);
                var card = makeCard(u.path + '?track=' + trackKey, u.accent, u.r, u.g, u.b, u.label, u.name, isCurrent, null, false, false);
                grid.appendChild(card);
            });

        } else {
            document.getElementById('aer-hub').style.display = 'none';
            document.getElementById('dbl-hub').style.display = 'block';

            // Projects
            var pgrid = document.getElementById('project-grid');
            pgrid.innerHTML = '';
            DBL_PROJECTS.forEach(function (p) {
                var card = makeCard(p.path + (p.coming ? '' : '?track=dbl'), cfg.accent, cfg.r, cfg.g, cfg.b, p.n, p.name, false, p.icon, true, !!p.coming);
                pgrid.appendChild(card);
            });

            // Reference units
            var rrow = document.getElementById('ref-unit-row');
            rrow.innerHTML = '';
            DBL_REF_UNITS.forEach(function (u) {
                var chip = document.createElement('a');
                chip.href = u.path + '?track=dbl';
                chip.className = 'ref-chip';
                chip.innerHTML = '<span class="ref-chip-num" style="color:' + u.accent + '">' + u.label + '</span>' + u.name;
                rrow.appendChild(chip);
            });
        }
    }

    /* ── Track management ────────────────────────────────── */

    function selectTrack(key) {
        localStorage.setItem('cteTrack', key);
        render(key);
    }

    function resetTrack() {
        localStorage.removeItem('cteTrack');
        document.getElementById('hub').style.display = 'none';
        document.getElementById('selector').style.display = 'flex';
    }

    window.selectTrack = selectTrack;
    window.resetTrack  = resetTrack;

    /* ── Init ────────────────────────────────────────────── */

    var track = param('track') || localStorage.getItem('cteTrack');
    if (track && TRACKS[track]) {
        localStorage.setItem('cteTrack', track);
        render(track);
    }
    // else: selector screen stays visible (default state)

}());
</script>
</body>
</html>
