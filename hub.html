<style>
/* ── TOKENS (dark-first) ─────────────────────────── */
:root {
  --bg:    #0d1117;
  --surf:  #161b22;
  --hi:    #1f2733;
  --bdr:   #30363d;
  --txt:   #e2e8f0;
  --muted: #7d8590;
  --acc:   #00d4ff;
  --accd:  rgba(0,212,255,.12);
  --mono: 'JetBrains Mono','Fira Code',monospace;
  --sans: 'DM Sans',system-ui,sans-serif;
  --orb:  'Orbitron',monospace;
  --r: 10px;
  --gap: 16px;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:#f0f4fb; --surf:#fff; --hi:#f5f7ff; --bdr:#d8dee9;
    --txt:#1c2030; --muted:#6a7185; --accd:rgba(0,190,220,.1);
  }
}
:root[data-theme="light"] {
  --bg:#f0f4fb; --surf:#fff; --hi:#f5f7ff; --bdr:#d8dee9;
  --txt:#1c2030; --muted:#6a7185; --accd:rgba(0,190,220,.1);
}
:root[data-theme="dark"] {
  --bg:#0d1117; --surf:#161b22; --hi:#1f2733; --bdr:#30363d;
  --txt:#e2e8f0; --muted:#7d8590; --accd:rgba(0,212,255,.12);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--sans);background:var(--bg);color:var(--txt);min-height:100vh;font-size:15px;line-height:1.55;}

/* ── HEADER ──────────────────────────────────────── */
.hub-header{
  position:sticky;top:0;z-index:20;
  background:var(--surf);border-bottom:1px solid var(--bdr);
  padding:0 20px;height:52px;
  display:flex;align-items:center;gap:12px;
}
.track-tabs{display:flex;gap:4px;flex:1;}
.tab{
  font-family:var(--mono);font-size:11px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;
  padding:5px 12px;border-radius:6px;
  border:1.5px solid transparent;background:transparent;
  color:var(--muted);cursor:pointer;
  transition:color .15s,border-color .15s,background .15s;
  white-space:nowrap;
}
.tab:hover{color:var(--txt);border-color:var(--bdr);}
.tab.active{color:var(--acc);border-color:var(--acc);background:var(--accd);}
.week-chip{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em;white-space:nowrap;}
.week-chip b{color:var(--acc);}
.port-btn{
  font-family:var(--mono);font-size:11px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;
  padding:6px 14px;background:var(--acc);color:#000;
  border-radius:6px;text-decoration:none;white-space:nowrap;
  transition:opacity .15s;
}
.port-btn:hover{opacity:.82;}
.port-btn:focus-visible{outline:2px solid var(--acc);outline-offset:3px;}

/* ── GRID ────────────────────────────────────────── */
.hub-grid{
  max-width:1060px;margin:0 auto;padding:var(--gap);
  display:grid;grid-template-columns:1fr 320px;gap:var(--gap);
  align-items:start;
}

/* ── CARD ────────────────────────────────────────── */
.card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);overflow:hidden;}
.eyebrow{
  font-family:var(--mono);font-size:10px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);padding:14px 16px 0;
}

/* ── THIS WEEK ───────────────────────────────────── */
#this-week{border-top:3px solid var(--acc);}
.wk-head{
  padding:16px 18px 14px;border-bottom:1px solid var(--bdr);
  display:flex;align-items:baseline;gap:14px;
}
.wk-num{
  font-family:var(--mono);font-size:52px;font-weight:700;
  color:var(--acc);line-height:1;opacity:.15;flex-shrink:0;user-select:none;
}
.wk-meta{flex:1;}
.wk-title{font-size:20px;font-weight:700;text-wrap:balance;}
.wk-sub{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em;margin-top:3px;}
.lesson-list{padding:14px;display:flex;flex-direction:column;gap:8px;}
.lesson-row{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;background:var(--hi);
  border:1px solid var(--bdr);border-radius:8px;
  text-decoration:none;color:var(--txt);
  transition:border-color .15s,background .15s;
}
.lesson-row:hover{border-color:var(--acc);background:var(--accd);}
.lesson-row:focus-visible{outline:2px solid var(--acc);outline-offset:2px;}
.l-icon{
  width:38px;height:38px;display:flex;align-items:center;justify-content:center;
  background:var(--accd);border-radius:7px;font-size:20px;flex-shrink:0;
}
.l-info{flex:1;min-width:0;}
.l-type{
  font-family:var(--mono);font-size:9px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--acc);margin-bottom:1px;
}
.l-name{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.l-arr{color:var(--muted);font-size:18px;}
.no-lesson{padding:28px 18px;color:var(--muted);font-size:14px;text-align:center;line-height:1.7;}
.no-lesson small{font-family:var(--mono);font-size:11px;display:block;margin-top:6px;}
.no-lesson a{color:var(--acc);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .15s;}
.no-lesson a:hover{border-color:var(--acc);}

/* ── SIDE COLUMN ──────────────────────────────────── */
.side-col{display:flex;flex-direction:column;gap:var(--gap);}

/* Career */
.car-body{padding:12px 16px 16px;}
.car-name{font-size:16px;font-weight:700;margin-top:6px;text-wrap:balance;}
.car-role{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.02em;margin-top:3px;}
.car-quote{
  margin-top:12px;padding-left:12px;border-left:3px solid var(--acc);
  font-size:13px;font-style:italic;color:var(--txt);line-height:1.65;
}
.car-link{
  display:inline-flex;align-items:center;gap:5px;margin-top:12px;
  font-family:var(--mono);font-size:10px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--acc);text-decoration:none;
}
.car-link:hover{text-decoration:underline;}

/* Quote */
.qt-body{padding:12px 16px 16px;}
.qt-glyph{
  font-family:Georgia,serif;font-size:56px;line-height:.7;
  color:var(--acc);opacity:.2;margin-bottom:8px;display:block;user-select:none;
}
.qt-text{font-size:13px;font-style:italic;line-height:1.7;color:var(--txt);}
.qt-by{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:8px;letter-spacing:.04em;}

/* Countdown */
.cd-body{padding:12px 16px 18px;text-align:center;}
.cd-event-name{
  font-family:var(--mono);font-size:13px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;
  color:var(--acc);margin:8px 0 4px;
}
.cd-event-date{
  font-family:var(--mono);font-size:11px;color:var(--muted);
  letter-spacing:.03em;margin-bottom:14px;
}
.cd-digits{
  display:flex;gap:4px;align-items:flex-start;justify-content:center;
}
.cd-unit{display:flex;flex-direction:column;align-items:center;min-width:52px;}
.cd-num{
  font-family:var(--orb);font-size:28px;font-weight:900;
  line-height:1;color:var(--txt);letter-spacing:.02em;
  font-variant-numeric:tabular-nums;
}
.cd-lbl{
  font-family:var(--mono);font-size:9px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);margin-top:4px;
}
.cd-sep{
  font-family:var(--orb);font-size:22px;font-weight:900;
  line-height:28px;color:var(--acc);opacity:.5;padding:0 1px;
}
.cd-done{
  font-family:var(--orb);font-size:16px;font-weight:900;
  color:var(--acc);letter-spacing:.06em;margin-top:8px;
}

/* Due This Week */
.due-section{padding:0 14px 14px;}
.due-divider{
  font-family:var(--mono);font-size:9px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  padding:10px 0 8px;border-top:1px solid var(--bdr);margin-top:6px;
}
.due-list{display:flex;flex-direction:column;gap:6px;}
.due-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;background:var(--hi);
  border:1px solid var(--bdr);border-radius:7px;
}
.due-badge{
  font-family:var(--mono);font-size:9px;font-weight:700;
  letter-spacing:.07em;text-transform:uppercase;
  padding:2px 7px;border-radius:4px;flex-shrink:0;
}
.due-badge.deliverable{background:rgba(80,250,123,.15);color:#50fa7b;}
.due-badge.quiz{background:rgba(255,149,0,.15);color:#ff9500;}
.due-name{font-size:13px;font-weight:500;color:var(--txt);}

/* Non-linked lesson row (days without a URL) */
.lesson-row.no-link{cursor:default;pointer-events:none;opacity:.62;}
.lesson-row.no-link:hover{transform:none;box-shadow:none;}

/* Week notes line */
.wk-notes{font-size:11px;color:var(--muted);margin-top:3px;font-style:italic;}

/* Responsive */
@media(max-width:720px){
  .hub-grid{grid-template-columns:1fr;}
  .wk-num{font-size:36px;}
  .hub-header{flex-wrap:wrap;height:auto;padding:10px 14px;gap:8px;}
  .track-tabs{order:1;width:100%;}
  .week-chip{order:2;}
  .port-btn{order:3;margin-left:auto;}
}
</style>

// ── SCHEDULE DATA (fetched from schedule-data.json) ───────
let scheduleData = null;

async function loadSchedule() {
  if (scheduleData) return;
  try {
    const resp = await fetch('schedule-data.json');
    scheduleData = await resp.json();
  } catch(e) {
    console.warn('schedule-data.json unavailable:', e);
  }
}

// Returns the week object whose start/end straddles today, or null.
// For aer8th checks G1 then G2 (date ranges don't overlap).
function getWeekData(track) {
  if (!scheduleData) return null;
  const today = new Date().toISOString().slice(0, 10); // 'YYYY-MM-DD'
  if (track === 'aer8th') {
    const g1 = scheduleData.tracks.aer8th?.g1?.weeks || [];
    const g2 = scheduleData.tracks.aer8th?.g2?.weeks || [];
    return g1.find(w => today >= w.start && today <= w.end)
        || g2.find(w => today >= w.start && today <= w.end)
        || null;
  }
  const weeks = scheduleData.tracks[track]?.weeks || [];
  return weeks.find(w => today >= w.start && today <= w.end) || null;
}

// ── UTILS ─────────────────────────────────────────────────
function getTrack() {
  const t = new URLSearchParams(location.search).get('track') || 'hsaer';
  return TRACKS[t] ? t : 'hsaer';
}
function getWeek() {
  const now = new Date();
  if (now < SCHOOL_START) return 1;
  return Math.min(Math.max(Math.floor((now - SCHOOL_START) / 86400000 / 7) + 1, 1), TOTAL_WEEKS);
}
function cycle(arr, week) { return arr[(week - 1) % arr.length]; }
function h(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── COUNTDOWN LOGIC ───────────────────────────────────────
function getTargetMs(dateStr) {
  const [y,m,d] = dateStr.split('-').map(Number);
  const probe = new Date(y, m-1, d, CD_CONFIG.confettiHour, CD_CONFIG.confettiMin, 0);
  const et    = new Date(probe.toLocaleString('en-US', {timeZone:'America/Detroit'}));
  return probe.getTime() + (probe - et);
}
function getConfettiEndMs(dateStr) {
  const [y,m,d] = dateStr.split('-').map(Number);
  const probe = new Date(y, m-1, d, CD_CONFIG.confettiEndHour, 0, 0);
  const et    = new Date(probe.toLocaleString('en-US', {timeZone:'America/Detroit'}));
  return probe.getTime() + (probe - et);
}

const CD_EVENTS = CD_CONFIG.events.map(e => ({
  ...e,
  targetMs:      getTargetMs(e.date),
  confettiEndMs: getConfettiEndMs(e.date),
}));

function pad2(n) { return String(Math.floor(n)).padStart(2,'0'); }

function formatDate(dateStr) {
  const [y,m,d] = dateStr.split('-').map(Number);
  return new Date(y, m-1, d).toLocaleDateString('en-US', {month:'long', day:'numeric', year:'numeric'});
}

function getNextCdEvent() {
  const now = Date.now();
  return CD_EVENTS.find(e => e.targetMs > now) || null;
}

function renderCountdown() {
  const ev  = getNextCdEvent();
  const now = Date.now();
  const el  = document.getElementById('countdown-card');

  let body;
  if (!ev) {
    body = `<div class="cd-done">HAVE A GREAT SUMMER!</div>`;
  } else {
    const ms = ev.targetMs - now;
    const s  = Math.max(0, Math.floor(ms / 1000));
    const days  = Math.floor(s / 86400);
    const hours = Math.floor((s % 86400) / 3600);
    const mins  = Math.floor((s % 3600) / 60);
    const secs  = s % 60;
    const sep   = '<div class="cd-sep">:</div>';
    body = `
      <div class="cd-event-name">${h(ev.label)}</div>
      <div class="cd-event-date">${h(formatDate(ev.date))} &bull; 10:56 AM</div>
      <div class="cd-digits">
        <div class="cd-unit"><div class="cd-num">${pad2(days)}</div><div class="cd-lbl">Days</div></div>
        ${sep}
        <div class="cd-unit"><div class="cd-num">${pad2(hours)}</div><div class="cd-lbl">Hrs</div></div>
        ${sep}
        <div class="cd-unit"><div class="cd-num">${pad2(mins)}</div><div class="cd-lbl">Min</div></div>
        ${sep}
        <div class="cd-unit"><div class="cd-num">${pad2(secs)}</div><div class="cd-lbl">Sec</div></div>
      </div>`;
  }
  el.innerHTML = `<div class="eyebrow">Countdown</div><div class="cd-body">${body}</div>`;
}

// ── CONFETTI ──────────────────────────────────────────────
const cvs = document.getElementById('confetti-canvas');
const ctx = cvs.getContext('2d');
let particles = [], confettiActive = false, confettiColors = [], rafId = null;

function resizeCvs() { cvs.width = innerWidth; cvs.height = innerHeight; }
window.addEventListener('resize', resizeCvs);
resizeCvs();

function spawnBurst(colors) {
  for (let i = 0; i < 220; i++)
    particles.push({
      x:Math.random()*cvs.width, y:Math.random()*cvs.height*0.5,
      w:Math.random()*13+4, h:Math.random()*7+3,
      color:colors[Math.floor(Math.random()*colors.length)],
      vx:(Math.random()-.5)*7, vy:Math.random()*4+1,
      rot:Math.random()*Math.PI*2, rotV:(Math.random()-.5)*.22, alpha:1
    });
}
function spawnDrizzle(colors) {
  if (particles.length < 450)
    for (let i = 0; i < 6; i++)
      particles.push({
        x:Math.random()*cvs.width, y:-10,
        w:Math.random()*11+4, h:Math.random()*6+3,
        color:colors[Math.floor(Math.random()*colors.length)],
        vx:(Math.random()-.5)*3, vy:Math.random()*3+1,
        rot:Math.random()*Math.PI*2, rotV:(Math.random()-.5)*.16, alpha:1
      });
}
function animateConfetti() {
  ctx.clearRect(0, 0, cvs.width, cvs.height);
  particles.forEach(p => {
    p.x+=p.vx; p.y+=p.vy; p.rot+=p.rotV;
    if (p.y > cvs.height*.8) p.alpha -= .02;
    ctx.save(); ctx.globalAlpha=Math.max(0,p.alpha);
    ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    ctx.fillStyle=p.color; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    ctx.restore();
  });
  particles = particles.filter(p => p.alpha>0 && p.y<cvs.height+20);
  if (confettiActive) spawnDrizzle(confettiColors);
  if (particles.length>0 || confettiActive) rafId = requestAnimationFrame(animateConfetti);
  else rafId = null;
}
function startConfetti(colors) {
  confettiColors=colors; confettiActive=true; spawnBurst(colors);
  if (!rafId) rafId = requestAnimationFrame(animateConfetti);
}
function stopConfetti() { confettiActive=false; }

const confettiFired = new Set();
function checkConfetti() {
  const now = Date.now();
  CD_EVENTS.forEach(e => {
    if (confettiFired.has(e.id)) return;
    if (e.targetMs <= now) {
      confettiFired.add(e.id);
      if (now <= e.confettiEndMs) {
        startConfetti(e.colors);
        setTimeout(stopConfetti, e.confettiEndMs - now);
      }
    }
  });
}

// ── RENDERERS ─────────────────────────────────────────────
function renderTabs(active) {
  document.getElementById('tabs').innerHTML = Object.entries(TRACKS).map(([k,m]) =>
    `<button class="tab${k===active?' active':''}" onclick="sw('${k}')">${h(m.label)}</button>`
  ).join('');
}

function renderThisWeek(track, weekData, meta, week) {
  // Build lesson rows from daily schedule entries
  const days = (weekData?.daily || []).filter(d => !d.content.startsWith('No School'));
  const lessonRows = days.map(d => {
    if (d.url) {
      return `<a class="lesson-row" href="${h(appendTrack(d.url, track))}" target="_blank" rel="noopener">
        <div class="l-icon">📐</div>
        <div class="l-info">
          <div class="l-type">${h(d.day)}</div>
          <div class="l-name">${h(d.content)}</div>
        </div>
        <span class="l-arr">›</span></a>`;
    } else {
      return `<div class="lesson-row no-link">
        <div class="l-icon">📋</div>
        <div class="l-info">
          <div class="l-type">${h(d.day)}</div>
          <div class="l-name">${h(d.content)}</div>
        </div></div>`;
    }
  }).join('');

  // Build "Due This Week" section — deliverable links to portfolio, quiz as non-linked chip
  const del  = weekData?.deliverable;
  const quiz = weekData?.quiz;
  let dueRows = '';
  if (del) {
    const portfolioUrl = BASE + 'Portfolio/?track=' + track;
    dueRows += `<a class="lesson-row" href="${h(portfolioUrl)}" target="_blank" rel="noopener">
      <div class="l-icon">📋</div>
      <div class="l-info">
        <div class="l-type">Due ${h(del.due || 'This Week')}</div>
        <div class="l-name">${h(del.label)} — ${h(del.title)}</div>
      </div>
      <span class="l-arr">›</span></a>`;
  }
  if (quiz) {
    dueRows += `<div class="lesson-row no-link">
      <div class="l-icon">📝</div>
      <div class="l-info">
        <div class="l-type">Quiz &mdash; ${h(quiz.day)}</div>
        <div class="l-name">${h(quiz.id)} &mdash; ${h(quiz.title)}</div>
      </div></div>`;
  }
  const dueSection = dueRows ? `
    <div class="due-section">
      <div class="due-divider">Due This Week</div>
      <div class="due-list">${dueRows}</div>
    </div>` : '';

  const weekTitle = weekData?.title || (meta.label + ' · Week ' + week);
  const weekNotes = weekData?.notes ? `<div class="wk-notes">${h(weekData.notes)}</div>` : '';

  document.getElementById('this-week').innerHTML = `
    <div class="eyebrow">This Week</div>
    <div class="wk-head">
      <div class="wk-num">${week}</div>
      <div class="wk-meta">
        <div class="wk-title">${h(weekTitle)}</div>
        <div class="wk-sub">2026&ndash;27 &nbsp;&bull;&nbsp; ${TOTAL_WEEKS - week} weeks remaining</div>
        ${weekNotes}
      </div>
    </div>
    ${lessonRows
      ? `<div class="lesson-list">${lessonRows}</div>`
      : `<div class="no-lesson">No new lesson this week.<br>
           <small>Continue your current project &mdash;
           <a href="${BASE}Portfolio/?track=${track}" target="_blank" rel="noopener">check your deliverables in your portfolio</a>.</small></div>`
    }
    ${dueSection}`;
}

function renderCareer(weekData, fallbackWeek) {
  let name, role, link, quote;
  if (weekData?.careerConnection) {
    const c = weekData.careerConnection;
    name  = c.name;
    role  = c.role;
    link  = c.link;
    quote = null; // quotes added per-week when ready
  } else {
    const c = cycle(CAREERS, fallbackWeek);
    name  = c.name;
    role  = c.title + ' · ' + c.org;
    link  = CAREER_BASE + c.pdf;
    quote = c.quote;
  }
  document.getElementById('career-card').innerHTML = `
    <div class="eyebrow">Career Connection</div>
    <div class="car-body">
      <div class="car-name">${h(name)}</div>
      <div class="car-role">${h(role)}</div>
      ${quote ? `<blockquote class="car-quote">&ldquo;${h(quote)}&rdquo;</blockquote>` : ''}
      <a class="car-link" href="${h(link)}" target="_blank" rel="noopener">
        View ${h(name.split(' ')[0])}'s full profile ›
      </a>
    </div>`;
}

function renderQuote(weekData, fallbackWeek) {
  const q = (weekData?.quote) || cycle(QUOTES, fallbackWeek);
  document.getElementById('quote-card').innerHTML = `
    <div class="eyebrow">Quote of the Week</div>
    <div class="qt-body">
      <span class="qt-glyph" aria-hidden="true">&ldquo;</span>
      <p class="qt-text">${h(q.text)}</p>
      <p class="qt-by">${h(q.by)}</p>
    </div>`;
}

// ── INIT + TICK ───────────────────────────────────────────
function appendTrack(url, track) {
  return url + (url.includes('?') ? '&' : '?') + 'track=' + track;
}

function isDark() {
  const t = document.documentElement.getAttribute('data-theme');
  if (t === 'dark') return true;
  if (t === 'light') return false;
  return window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function setBackground(bg) {
  const overlay = isDark()
    ? 'linear-gradient(rgba(13,17,23,0.88),rgba(13,17,23,0.88))'
    : 'linear-gradient(rgba(248,250,253,0.30),rgba(248,250,253,0.30))';
  document.body.style.cssText += `;background-image:${overlay},url('${bg}');background-size:cover;background-position:center;background-repeat:no-repeat;background-attachment:fixed;`;
}

async function render() {
  const track = getTrack();
  const meta  = TRACKS[track];

  // Load schedule once; all subsequent calls use the cached copy
  await loadSchedule();

  const weekData = getWeekData(track);
  const week = weekData?.week || getWeek(); // getWeek() is fallback if JSON not loaded or no match

  document.documentElement.style.setProperty('--acc',  meta.acc);
  document.documentElement.style.setProperty('--accd', meta.accd);
  setBackground(meta.bg);

  renderTabs(track);
  document.getElementById('wkChip').innerHTML = `WEEK <b>${week}</b> &middot; 2026&ndash;27`;
  document.getElementById('portBtn').href = BASE + 'Portfolio/?track=' + track;

  renderThisWeek(track, weekData, meta, week);
  renderCareer(weekData, week);
  renderQuote(weekData, week);
}

function sw(t) {
  const u = new URL(location.href);
  u.searchParams.set('track', t);
  history.pushState({}, '', u);
  render(); // schedule already cached; instant re-render
}

function tick() { renderCountdown(); checkConfetti(); }

render(); // returns a Promise — fire-and-forget is fine
tick();
setInterval(tick, 1000);
</script>
