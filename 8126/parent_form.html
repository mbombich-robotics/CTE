<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VCS Robotics — Parent Info</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --navy: #1b2a4a;
    --navy-light: #2c4270;
    --bg: #f5f3ee;
    --card: #ffffff;
    --text: #22262f;
    --muted: #6b7280;
    --border: #e2e0d8;
    --danger: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 60px;
    background: var(--bg);
    font-family: Arial, Helvetica, sans-serif;
    color: var(--text);
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 24px; }
  header h1 { font-size: 22px; color: var(--navy); margin: 0 0 6px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .card h2 {
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--navy);
    margin: 0 0 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin: 12px 0 4px;
  }
  input[type=text], input[type=email], input[type=tel], select {
    width: 100%;
    padding: 10px 12px;
    font-size: 15px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    color: var(--text);
  }
  input:focus, select:focus { outline: 2px solid var(--navy-light); outline-offset: 1px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .child-block {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-top: 14px;
    background: #fafafa;
    position: relative;
  }
  .child-title { font-size: 13px; font-weight: bold; color: var(--navy); margin-bottom: 4px; }
  .remove-child {
    position: absolute; top: 12px; right: 12px;
    background: none; border: none; color: var(--danger);
    font-size: 13px; cursor: pointer; text-decoration: underline;
  }
  .roles {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px;
  }
  .roles label {
    display: flex; align-items: center; gap: 8px;
    font-size: 14px; color: var(--text); margin: 0;
    background: #fff; border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; cursor: pointer;
  }
  .roles input { width: auto; }
  .add-child-btn, .submit-btn {
    width: 100%; padding: 13px; border-radius: 8px;
    font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 16px; border: none;
  }
  .add-child-btn { background: #fff; border: 1.5px dashed var(--navy-light); color: var(--navy-light); }
  .submit-btn { background: var(--navy); color: #fff; }
  .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .error-msg { color: var(--danger); font-size: 13px; margin-top: 8px; display: none; }
  .confirm-screen { text-align: center; padding: 40px 20px; }
  .confirm-screen h2 { color: var(--navy); font-size: 22px; }
  .confirm-screen p { color: var(--muted); }
  .confirm-screen .checkmark { font-size: 56px; display: block; margin-bottom: 16px; }
  .confirm-screen button {
    margin-top: 20px; padding: 12px 24px; border-radius: 8px;
    border: 1px solid var(--navy); background: #fff; color: var(--navy);
    font-weight: bold; cursor: pointer;
  }
  .qr-screen { text-align: center; padding: 40px 20px; }
  .qr-screen h1 { font-size: 26px; color: var(--navy); margin-bottom: 4px; }
  .qr-screen p.sub { color: var(--muted); font-size: 14px; margin-bottom: 0; }
  #qrcode { display: inline-block; margin: 24px auto; padding: 18px; background: #fff; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  .qr-screen p.link { font-size: 13px; color: var(--muted); word-break: break-all; margin-top: 0; }
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>

<script>
// ── Paste your deployed Apps Script URL here after deploying ──────────────────
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxSId_xJpoV06JIPtKC23HvK3F9pmZm417ZRcAo8PJUJeYNsWWXr1J2MXxgPmsquL5W/exec';
// ─────────────────────────────────────────────────────────────────────────────

const ROLE_OPTIONS = [
  'Programmer',
  'Builder / Fabrication',
  'Media (photos & video)',
  "Engineer's Portfolio"
];
const SHIRT_SIZES = ['Youth XS','Youth S','Youth M','Youth L','Adult S','Adult M','Adult L','Adult XL','Adult XXL'];
const GRADES = ['6th','7th','8th','9th','10th','11th','12th'];

const mode = new URLSearchParams(location.search).get('mode');
let childCount = 0;
let contactCount = 0;

function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function makeContactBlock(index) {
  const ordinal = ['2nd','3rd','4th','5th'][index] || (index + 2) + 'th';
  const block = el(`
    <div class="child-block contact-block">
      <button type="button" class="remove-child">Remove</button>
      <div class="child-title">${ordinal} contact</div>
      <div class="row2">
        <div><label>First name</label><input type="text" class="c-first"></div>
        <div><label>Last name</label><input type="text" class="c-last"></div>
      </div>
      <label>Email</label>
      <input type="email" class="c-email" placeholder="optional">
      <label>Phone</label>
      <input type="tel" class="c-phone" placeholder="(269) 555-1234  optional">
    </div>
  `);
  block.querySelector('.remove-child').addEventListener('click', () => block.remove());
  return block;
}

function makeChildBlock(index) {
  const rolesHtml = ROLE_OPTIONS.map(r =>
    `<label><input type="checkbox" name="role" value="${r}"> ${r}</label>`
  ).join('');
  const gradesHtml = GRADES.map(g => `<option value="${g}">${g}</option>`).join('');
  const sizesHtml  = SHIRT_SIZES.map(s => `<option value="${s}">${s}</option>`).join('');
  const block = el(`
    <div class="child-block">
      ${index > 0 ? '<button type="button" class="remove-child">Remove</button>' : ''}
      <div class="child-title">Child ${index + 1}</div>
      <label>Child's name *</label>
      <input type="text" class="child-name" required>
      <div class="row2">
        <div>
          <label>Grade *</label>
          <select class="child-grade" required>
            <option value="">Select grade</option>
            ${gradesHtml}
          </select>
        </div>
        <div>
          <label>T-shirt size *</label>
          <select class="child-size" required>
            <option value="">Select size</option>
            ${sizesHtml}
          </select>
        </div>
      </div>
      <label>Interested role(s) — check all that apply</label>
      <div class="roles">${rolesHtml}</div>
    </div>
  `);
  const removeBtn = block.querySelector('.remove-child');
  if (removeBtn) removeBtn.addEventListener('click', () => block.remove());
  return block;
}

function renderForm() {
  const wrap = document.getElementById('wrap');
  wrap.innerHTML = `
    <header>
      <h1>Vicksburg Robotics — Parent Info</h1>
      <p>One form per family · takes about 2 minutes</p>
    </header>
    <form id="parentForm">
      <div class="card">
        <h2>Parent / guardian</h2>
        <div class="row2">
          <div><label>First name *</label><input type="text" id="p-first" required></div>
          <div><label>Last name *</label><input type="text" id="p-last" required></div>
        </div>
        <label>Email *</label>
        <input type="email" id="p-email" required>
        <label>Phone *</label>
        <input type="tel" id="p-phone" required placeholder="(269) 555-1234">
        <div id="extraContactsContainer"></div>
        <button type="button" class="add-child-btn" id="addContactBtn" style="margin-top:14px;">+ Add another contact person</button>
      </div>
      <div class="card">
        <h2>Your child(ren)</h2>
        <div id="childrenContainer"></div>
        <button type="button" class="add-child-btn" id="addChildBtn">+ Add another child</button>
      </div>
      <div class="error-msg" id="formError"></div>
      <button type="submit" class="submit-btn" id="submitBtn">Submit →</button>
    </form>
  `;

  const extraContactsContainer = document.getElementById('extraContactsContainer');
  contactCount = 0;
  document.getElementById('addContactBtn').addEventListener('click', () => {
    extraContactsContainer.appendChild(makeContactBlock(contactCount++));
  });

  const container = document.getElementById('childrenContainer');
  childCount = 0;
  container.appendChild(makeChildBlock(childCount++));

  document.getElementById('addChildBtn').addEventListener('click', () => {
    container.appendChild(makeChildBlock(childCount++));
  });

  document.getElementById('parentForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById('formError');
    errorEl.style.display = 'none';

    const first = document.getElementById('p-first').value.trim();
    const last  = document.getElementById('p-last').value.trim();
    const email = document.getElementById('p-email').value.trim();
    const phone = document.getElementById('p-phone').value.trim();

    // Collect additional contacts (all fields optional)
    const additionalContacts = Array.from(
      extraContactsContainer.querySelectorAll('.contact-block')
    ).map(block => ({
      firstName: block.querySelector('.c-first').value.trim(),
      lastName:  block.querySelector('.c-last').value.trim(),
      email:     block.querySelector('.c-email').value.trim(),
      phone:     block.querySelector('.c-phone').value.trim(),
    })).filter(c => c.firstName || c.lastName || c.email || c.phone);

    const childBlocks = Array.from(container.querySelectorAll('.child-block'));
    const children = [];
    let valid = first && last && email && phone && childBlocks.length > 0;

    for (const block of childBlocks) {
      const name  = block.querySelector('.child-name').value.trim();
      const grade = block.querySelector('.child-grade').value;
      const size  = block.querySelector('.child-size').value;
      const roles = Array.from(block.querySelectorAll('input[name="role"]:checked')).map(cb => cb.value);
      if (!name || !grade || !size) valid = false;
      children.push({ name, grade, shirtSize: size, roles });
    }

    if (!valid) {
      errorEl.textContent = 'Please fill in all required fields (marked with *).';
      errorEl.style.display = 'block';
      return;
    }

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting…';

    try {
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({
          parent: { firstName: first, lastName: last, email, phone },
          additionalContacts,
          children,
          submittedAt: new Date().toISOString()
        })
      });
      const result = await res.json();
      if (result.status !== 'ok') throw new Error(result.message || 'Server error');
      showConfirmation();
    } catch (err) {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit →';
      errorEl.textContent = 'Something went wrong. Please try again or see Mr. Bombich.';
      errorEl.style.display = 'block';
    }
  });
}

function showConfirmation() {
  document.getElementById('wrap').innerHTML = `
    <div class="confirm-screen">
      <span class="checkmark">✅</span>
      <h2>You're in!</h2>
      <p>Thanks — your family's info has been saved.<br>We'll be in touch about the season.</p>
      <button onclick="renderForm()">Submit another family</button>
    </div>
  `;
}

function renderQr() {
  const url = location.origin + location.pathname;
  document.getElementById('wrap').innerHTML = `
    <div class="qr-screen">
      <h1>Vicksburg Robotics</h1>
      <p class="sub">Scan to submit your family's info</p>
      <div id="qrcode"></div>
      <p class="link">${url}</p>
    </div>
  `;
  try {
    new QRCode(document.getElementById('qrcode'), { text: url, width: 280, height: 280 });
  } catch (err) {
    document.getElementById('qrcode').textContent = 'QR unavailable — use the link above.';
  }
}

if (mode === 'qr') {
  renderQr();
} else {
  renderForm();
}
</script>
</body>
</html>
