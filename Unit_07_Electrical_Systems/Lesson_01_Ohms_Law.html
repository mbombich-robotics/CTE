    let currentSlideIndex = 0;

    function renderSlide(index) {
        if (index < 0 || index >= slides.length) return;
        currentSlideIndex = index;

        const slide = slides[index];
        const container = document.getElementById('slideContainer');

        container.innerHTML = `
            <div class="flex items-start justify-between pb-3 border-b border-gray-800/80 mb-4">
                <div>
                    <span class="text-xs font-mono text-indigo-400 uppercase tracking-widest font-semibold">Slide ${slide.id} of ${slides.length}</span>
                    <div class="text-xl sm:text-2xl font-bold text-white tracking-tight mt-0.5">${slide.title}</div>
                </div>
                <p class="text-xs text-gray-500 hidden sm:block text-right max-w-xs">${slide.subtitle}</p>
            </div>
            <div class="flex-1 flex flex-col slide-body">
                ${slide.render()}
            </div>
        `;

        document.getElementById('counter').textContent = `${slide.id} / ${slides.length}`;
        document.getElementById('prevBtn').disabled = currentSlideIndex === 0;
        document.getElementById('nextBtn').disabled = currentSlideIndex === slides.length - 1;

        if (slide.onMount) {
            setTimeout(slide.onMount, 50);
        }
    }

    function nextSlide() {
        if (currentSlideIndex < slides.length - 1) renderSlide(currentSlideIndex + 1);
    }

    function prevSlide() {
        if (currentSlideIndex > 0) renderSlide(currentSlideIndex - 1);
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === 'PageDown') nextSlide();
        else if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevSlide();
    });

    // ─────────────────────────────────────────────

    // 1. Hydraulic Pipe Simulation (Slide 3)
    let pipeAnimId = null;
    function initPipeVisualizer() {
        const canvas = document.getElementById('pipeCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const vSlider = document.getElementById('vPipeSlider');
        const rSlider = document.getElementById('rPipeSlider');
        const vValText = document.getElementById('vSliderVal');
        const rValText = document.getElementById('rSliderVal');
        const curText = document.getElementById('analogyCurrentText');

        let particles = Array.from({ length: 40 }, () => ({
            x: Math.random() * canvas.width,
            y: 0,
            speed: 2
        }));

        function animate() {
            if (!document.getElementById('pipeCanvas')) return;
            const v = parseFloat(vSlider.value);
            const r = parseFloat(rSlider.value);
            const i = v / r;
            vValText.textContent = `${v} V`;
            rValText.textContent = `${r} Ω`;
            curText.textContent = `Current = ${i.toFixed(2)} A`;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const pipeTop = 50, pipeHeight = 100;
            const constrictionFactor = Math.max(15, 80 - (r * 2));

            ctx.fillStyle = '#1E293B';
            ctx.fillRect(0, pipeTop, canvas.width, pipeHeight);
            ctx.fillStyle = '#F59E0B';
            ctx.fillRect(180, pipeTop, 140, (pipeHeight - constrictionFactor) / 2);
            ctx.fillRect(180, pipeTop + pipeHeight - (pipeHeight - constrictionFactor) / 2, 140, (pipeHeight - constrictionFactor) / 2);
            ctx.fillStyle = 'rgba(6,182,212,0.2)';
            ctx.fillRect(0, pipeTop, canvas.width, pipeHeight);

            ctx.fillStyle = '#06B6D4';
            particles.forEach(p => {
                p.x += i * 2.5;
                if (p.x > canvas.width) p.x = 0;
                let yMin = pipeTop + 10, yMax = pipeTop + pipeHeight - 10;
                if (p.x > 180 && p.x < 320) {
                    yMin = pipeTop + (pipeHeight - constrictionFactor) / 2 + 5;
                    yMax = pipeTop + pipeHeight - (pipeHeight - constrictionFactor) / 2 - 5;
                }
                if (p.y < yMin || p.y > yMax) p.y = yMin + Math.random() * (yMax - yMin);
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fill();
            });
            pipeAnimId = requestAnimationFrame(animate);
        }

        if (pipeAnimId) cancelAnimationFrame(pipeAnimId);
        animate();
    }

                    <input type="number" id="triInputV" value="5" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-xs text-white font-mono"></div>
                    <div><label class="text-[10px] text-gray-400 block">Current (I in Amps)</label>
                    <input type="number" id="triInputI2" value="0.02" step="0.001" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-xs text-white font-mono"></div>
                </div>
                <div class="mt-4 p-3 bg-amber-950/40 border border-amber-800/50 rounded-xl text-center font-mono text-amber-300 font-bold text-base" id="triResult">Resistance (R) = 250.00 &Omega;</div>`;
        }
        card.innerHTML = html;

        const updateTriCalc = () => {
            const res = document.getElementById('triResult');
            if (!res) return;
            if (variable === 'V') {
                const i = parseFloat(document.getElementById('triInputI').value) || 0;
                const r = parseFloat(document.getElementById('triInputR').value) || 0;
                res.textContent = `Voltage (V) = ${(i * r).toFixed(2)} V`;
            } else if (variable === 'I') {
                const v = parseFloat(document.getElementById('triInputV').value) || 0;
                const r = parseFloat(document.getElementById('triInputR2').value) || 1;
                const val = v / r;
                res.textContent = `Current (I) = ${val.toFixed(3)} A (${(val * 1000).toFixed(1)} mA)`;
            } else if (variable === 'R') {
                const v = parseFloat(document.getElementById('triInputV').value) || 0;
                const i = parseFloat(document.getElementById('triInputI2').value) || 0.001;
                res.textContent = `Resistance (R) = ${(v / i).toFixed(2)} Ω`;
            }
        };
        card.querySelectorAll('input').forEach(inp => inp.addEventListener('input', updateTriCalc));
    }

    // 3. Unit Converter (Slide 5)
    function initUnitConverter() {
        const input = document.getElementById('unitValInput');
        const select = document.getElementById('unitTypeSelect');
        const res1 = document.getElementById('convResult1');
        const res2 = document.getElementById('convResult2');
        if (!input) return;

        function update() {
            const val = parseFloat(input.value) || 0;
            const type = select.value;
            if (type === 'mA') {
                res1.textContent = `${val} mA = ${(val / 1000).toFixed(5)} Amperes (A)`;
                res2.textContent = `${val} mA = ${(val * 1000).toLocaleString()} Microamperes (μA)`;
            } else if (type === 'A') {
                res1.textContent = `${val} A = ${(val * 1000).toLocaleString()} Milliamperes (mA)`;
                res2.textContent = `${val} A = ${(val * 1000000).toLocaleString()} Microamperes (μA)`;
            } else if (type === 'kOhm') {
                res1.textContent = `${val} kΩ = ${(val * 1000).toLocaleString()} Ohms (Ω)`;
                res2.textContent = `${val} kΩ = ${(val / 1000).toFixed(4)} Megohms (MΩ)`;
            } else if (type === 'Ohm') {
                res1.textContent = `${val} Ω = ${(val / 1000).toFixed(4)} Kilo-ohms (kΩ)`;
                res2.textContent = `${val} Ω = ${(val / 1000000).toFixed(6)} Megohms (MΩ)`;
            }
        }
        input.oninput = update;
        select.onchange = update;
        update();
    }

    function setPreset(v, r, label) {
        const input = document.getElementById('unitValInput');
        const select = document.getElementById('unitTypeSelect');
        const presetResult = document.getElementById('presetResult');
        if (!input) return;
        const iAmps = v / r;
        const iMa = iAmps * 1000;
        input.value = iMa.toFixed(2);
        select.value = 'mA';
        input.dispatchEvent(new Event('input'));
        if (presetResult) {
            presetResult.classList.remove('hidden');
            presetResult.textContent = `${label}: ${v}V ÷ ${r}Ω = ${iMa.toFixed(2)} mA`;
        }
    }

    // 4. Proportional Simulator Canvas (Slide 6)
    let propAnimId = null;
    function initProportionalSim() {
        const canvas = document.getElementById('propCircuitCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const vSlider = document.getElementById('propVSlider');
        const rSlider = document.getElementById('propRSlider');
        const vText = document.getElementById('propVVal');
        const rText = document.getElementById('propRVal');
        const iText = document.getElementById('propCalculatedI');
        let dots = Array.from({ length: 25 }, () => ({ pos: Math.random() * 800 }));

        function animate() {
            if (!document.getElementById('propCircuitCanvas')) return;
            const v = parseFloat(vSlider.value);
            const r = parseFloat(rSlider.value);
            const iAmps = v / r;
            const iMilli = iAmps * 1000;
            vText.textContent = `${v} V`;
            rText.textContent = `${r} Ω`;
            iText.textContent = `I = ${iMilli.toFixed(1)} mA`;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 8;
            ctx.strokeRect(60, 40, 380, 120);
            ctx.fillStyle = '#EC4899';
            ctx.fillRect(52, 70, 16, 60);
            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 12px Inter';
            ctx.fillText(`${v}V`, 20, 105);
            ctx.fillStyle = '#F59E0B';
            ctx.fillRect(432, 70, 16, 60);
            ctx.fillText(`${r}Ω`, 455, 105);

            const perimeter = 1000;
            const speed = iMilli * 0.3;
            ctx.fillStyle = '#06B6D4';
            dots.forEach(d => {
                d.pos = (d.pos + speed) % perimeter;
                let x = 60, y = 40;
                if (d.pos < 380) { x = 60 + d.pos; y = 40; }
                else if (d.pos < 500) { x = 440; y = 40 + (d.pos - 380); }
                else if (d.pos < 880) { x = 440 - (d.pos - 500); y = 160; }
                else { x = 60; y = 160 - (d.pos - 880); }
                ctx.beginPath();
                ctx.arc(x, y, 5, 0, Math.PI * 2);
                ctx.fill();
            });
            propAnimId = requestAnimationFrame(animate);
        }

        if (propAnimId) cancelAnimationFrame(propAnimId);
        animate();
    }

    // 5. Worked Example Steps (Slide 7)
    function setEx1Step(stepNum) {
        for (let i = 1; i <= 3; i++) {
            const el = document.getElementById(`ex1Step${i}`);
            if (!el) continue;
            const body = el.querySelector('.id-body');
            if (i <= stepNum) {
                el.classList.add('border-indigo-500', 'bg-indigo-950/20');
                if (body) body.classList.remove('hidden');
            } else {
                el.classList.remove('border-indigo-500', 'bg-indigo-950/20');
                if (body) body.classList.add('hidden');
            }
        }
    }

    // 6. LED Calculator (Slide 8)
    function initLedCalc() {
        const vsInput = document.getElementById('ledVs');
        const vfInput = document.getElementById('ledVf');
        const iInput = document.getElementById('ledI');
        const resBox = document.getElementById('ledResultBox');
        if (!vsInput) return;

        function calc() {
            const vs = parseFloat(vsInput.value) || 0;
            const vf = parseFloat(vfInput.value) || 0;
            const iMa = parseFloat(iInput.value) || 1;
            const vRes = vs - vf;
            if (vRes <= 0) {
                resBox.textContent = 'Error: Supply Voltage must exceed LED Forward Voltage';
                return;
            }
            const r = vRes / (iMa / 1000);
            resBox.textContent = `Required Resistor: ${r.toFixed(1)} Ω`;
        }
        [vsInput, vfInput, iInput].forEach(inp => inp.oninput = calc);
    }

    // 7. Knowledge Check Quiz (Slide 9)
    const quizQuestions = [
        {
            q: "If you double the Voltage in a circuit while keeping Resistance constant, what happens to the Current?",
            options: ["Current is cut in half", "Current stays the same", "Current doubles", "Current quadruples"],
            correct: 2,
            explanation: "Current is directly proportional to Voltage (I = V &divide; R). Double V at fixed R → double I."
        },
        {
            q: "How many Amperes is 250 mA equal to?",
            options: ["25 A", "2.5 A", "0.025 A", "0.25 A"],
            correct: 3,
            explanation: "Divide by 1,000: 250 mA &divide; 1000 = 0.25 A."
        },
        {
            q: "A circuit has a 9V battery and a 300 Ω resistor. What is the current?",
            options: ["3 mA (0.003 A)", "30 mA (0.03 A)", "300 mA (0.3 A)", "2700 mA (2.7 A)"],
            correct: 1,
            explanation: "I = V &divide; R = 9 &divide; 300 = 0.03 A = 30 mA."
        }
    ];

    let currentQuizIdx = 0;
    let selectedAnswers = {};

    function initQuiz() {
        currentQuizIdx = 0;
        selectedAnswers = {};
        renderQuizQuestion(0);
    }

    function renderQuizQuestion(idx) {
        const q = quizQuestions[idx];
        const container = document.getElementById('quizContainer');
        const badge = document.getElementById('quizScoreBadge');
        if (!container) return;
        if (badge) badge.textContent = `Question ${idx + 1} of ${quizQuestions.length}`;

        container.innerHTML = `
            <p class="text-sm font-semibold text-white mb-3">${q.q}</p>
            <div class="space-y-2">
                ${q.options.map((opt, i) => `
                    <button onclick="answerQuiz(${idx}, ${i})" class="w-full text-left p-3 rounded-xl border border-gray-800 bg-gray-900/60 hover:bg-gray-800 text-xs text-gray-300 transition flex items-center justify-between font-medium">
                        <span>${opt}</span>
                        ${selectedAnswers[idx] === i ? '<i class="fa-solid fa-circle-check text-indigo-400"></i>' : ''}
                    </button>
                `).join('')}
            </div>
            <div id="quizFeedback" class="mt-3 text-xs p-3 rounded-lg hidden font-mono"></div>
        `;
        if (selectedAnswers[idx] !== undefined) showQuizFeedback(idx, selectedAnswers[idx]);
    }

    function answerQuiz(qIdx, optIdx) {
        selectedAnswers[qIdx] = optIdx;
        renderQuizQuestion(qIdx);
        showQuizFeedback(qIdx, optIdx);
    }

    function showQuizFeedback(qIdx, optIdx) {
        const q = quizQuestions[qIdx];
        const fb = document.getElementById('quizFeedback');
        if (!fb) return;
        fb.classList.remove('hidden', 'bg-green-950', 'text-green-300', 'bg-red-950', 'text-red-300');
        if (optIdx === q.correct) {
            fb.classList.add('bg-green-950/80', 'text-green-300', 'border', 'border-green-800');
            fb.innerHTML = `<i class="fa-solid fa-check mr-1"></i> ${q.explanation}`;
        } else {
            fb.classList.add('bg-red-950/80', 'text-red-300', 'border', 'border-red-800');
            fb.innerHTML = `<i class="fa-solid fa-xmark mr-1"></i> Incorrect — try again!`;
        }
    }

    function nextQuiz() {
        if (currentQuizIdx < quizQuestions.length - 1) { currentQuizIdx++; renderQuizQuestion(currentQuizIdx); }
    }
    function prevQuiz() {
        if (currentQuizIdx > 0) { currentQuizIdx--; renderQuizQuestion(currentQuizIdx); }
    }

    // 8. Virtual DMM Sandbox (Slide 9)
    let dmmMode = 'V';
    function initDmmSandbox() {
        const vIn = document.getElementById('sandboxV');
        const rIn = document.getElementById('sandboxR');
        if (!vIn) return;
        dmmMode = 'V';
        ['V','I','R'].forEach(m => {
            const btn = document.getElementById(`dmmBtn${m}`);
            if (btn) btn.className = m === 'V'
                ? 'px-2 py-0.5 text-xs rounded bg-pink-600 text-white font-mono'
                : 'px-2 py-0.5 text-xs rounded bg-gray-800 text-gray-400 font-mono';
        });

        const updateDmm = () => {
            const v = parseFloat(vIn.value) || 0;
            const r = parseFloat(rIn.value) || 1;
            const display = document.getElementById('dmmDisplay');
            if (!display) return;
            if (dmmMode === 'V') {
                display.textContent = `${v.toFixed(2)} V`;
                display.className = 'text-center font-mono text-3xl font-extrabold text-pink-400 py-3 bg-black/80 rounded-lg border border-pink-950 shadow-inner tracking-widest';
            } else if (dmmMode === 'I') {
                display.textContent = `${((v/r)*1000).toFixed(1)} mA`;
                display.className = 'text-center font-mono text-3xl font-extrabold text-cyan-400 py-3 bg-black/80 rounded-lg border border-cyan-950 shadow-inner tracking-widest';
            } else {
                display.textContent = `${r.toFixed(0)} Ω`;
                display.className = 'text-center font-mono text-3xl font-extrabold text-amber-400 py-3 bg-black/80 rounded-lg border border-amber-950 shadow-inner tracking-widest';
            }
        };
        vIn.oninput = updateDmm;
        rIn.oninput = updateDmm;
        updateDmm();
    }

    function setDmmMode(mode) {
        dmmMode = mode;
        ['V','I','R'].forEach(m => {
            const btn = document.getElementById(`dmmBtn${m}`);
            if (btn) btn.className = m === mode
                ? 'px-2 py-0.5 text-xs rounded bg-indigo-600 text-white font-mono'
                : 'px-2 py-0.5 text-xs rounded bg-gray-800 text-gray-400 font-mono';
        });
        initDmmSandbox();
    }

    // ─────────────────────────────────────────────
    // OHMS LAW ACTIVITY (Slide 10)
    // ─────────────────────────────────────────────
    const ACT_PROBLEMS = [
        { find:'V', given:'I = 2 A, R = 5 Ω',      ans:10,   unit:'V'  },
        { find:'I', given:'V = 12 V, R = 4 Ω',      ans:3,    unit:'A'  },
        { find:'R', given:'V = 9 V, I = 3 A',        ans:3,    unit:'Ω'  },
        { find:'V', given:'I = 500 mA, R = 6 Ω',     ans:3,    unit:'V'  },
        { find:'I', given:'V = 5 V, R = 1000 Ω',     ans:5,    unit:'mA' },
        { find:'R', given:'V = 6 V, I = 20 mA',      ans:300,  unit:'Ω'  },
        { find:'V', given:'I = 10 mA, R = 470 Ω',    ans:4.7,  unit:'V'  },
        { find:'R', given:'V = 9 V, I = 50 mA',      ans:180,  unit:'Ω'  },
        { find:'I', given:'V = 3.3 V, R = 220 Ω',    ans:15,   unit:'mA' },
        { find:'V', given:'I = 100 mA, R = 33 Ω',    ans:3.3,  unit:'V'  },
    ];

    const FIND_COLOR = { V:'text-pink-400', I:'text-cyan-400', R:'text-amber-400' };
    const FIND_BG    = { V:'bg-pink-950/40 border-pink-800/50', I:'bg-cyan-950/40 border-cyan-800/50', R:'bg-amber-950/40 border-amber-800/50' };

    function initOhmActivity() {
        const el = document.getElementById('actProblems');
        if (!el) return;
        el.innerHTML = ACT_PROBLEMS.map((p, i) => `
            <div class="flex items-center gap-3 glass-card rounded-xl border ${FIND_BG[p.find]} p-3" id="actRow${i}">
                <span class="w-6 text-center text-xs font-mono text-gray-500">${i+1}.</span>
                <div class="flex-1 min-w-0">
                    <div class="text-xs text-gray-400 leading-tight">${p.given}</div>
                    <div class="text-xs font-bold ${FIND_COLOR[p.find]} mt-0.5">Find ${p.find}</div>
                </div>
                <input id="actIn${i}" type="number" step="any" placeholder="?"
                    class="w-20 bg-gray-900 border border-gray-700 rounded-lg px-2 py-1.5 text-sm text-center font-mono text-white focus:outline-none focus:border-indigo-500"
                    onkeydown="if(event.key==='Enter') checkOhmActivity()">
                <span class="text-xs font-mono text-gray-400 w-6">${p.unit}</span>
                <span id="actMark${i}" class="text-base w-5 text-center"></span>
            </div>`).join('');
        document.getElementById('actScore').textContent = '';
    }

    function checkOhmActivity() {
        let correct = 0;
        ACT_PROBLEMS.forEach((p, i) => {
            const raw = parseFloat(document.getElementById('actIn' + i)?.value);
            const mark = document.getElementById('actMark' + i);
            const row  = document.getElementById('actRow' + i);
            if (isNaN(raw)) { if (mark) mark.textContent = ''; return; }
            const ok = Math.abs(raw - p.ans) <= Math.max(p.ans * 0.02, 0.05);
            if (mark) mark.textContent = ok ? '✓' : '✗';
            if (row) {
                row.style.borderColor = ok ? 'rgba(34,197,94,0.5)' : 'rgba(239,68,68,0.5)';
                if (!ok) {
                    let hint = row.querySelector('.act-hint');
                    if (!hint) {
                        hint = document.createElement('div');
                        hint.className = 'act-hint text-[10px] text-gray-400 mt-1 col-span-full';
                        hint.style.gridColumn = '1 / -1';
                        row.appendChild(hint);
                    }
                    hint.textContent = `Answer: ${p.ans} ${p.unit}`;
                }
            }
            if (ok) correct++;
        });
        const answered = ACT_PROBLEMS.filter((_, i) => !isNaN(parseFloat(document.getElementById('actIn' + i)?.value))).length;
        const scoreEl = document.getElementById('actScore');
        if (scoreEl) scoreEl.textContent = `${correct} / ${answered} correct`;
    }

    function resetOhmActivity() {
        ACT_PROBLEMS.forEach((_, i) => {
            const inp  = document.getElementById('actIn' + i);
            const mark = document.getElementById('actMark' + i);
            const row  = document.getElementById('actRow' + i);
            if (inp)  inp.value = '';
            if (mark) mark.textContent = '';
            if (row) {
                row.style.borderColor = '';
                const hint = row.querySelector('.act-hint');
                if (hint) hint.remove();
            }
        });
        document.getElementById('actScore').textContent = '';
    }

    // ─────────────────────────────────────────────
    window.onload = () => renderSlide(0);
</script>
